services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gsd_db
      POSTGRES_USER: gsd_user
      POSTGRES_PASSWORD: gsd_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsd_user -d gsd_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    # Bound to localhost on purpose. Docker publishes ports via its own iptables
    # rules and bypasses UFW, so "0.0.0.0:8000" is reachable from the internet
    # even when UFW says incoming is denied. Expose it through nginx instead.
    ports:
      - "127.0.0.1:8000:8000"
    # The host's provider blocks most Telegram IP ranges; 149.154.167.220 is the
    # one that answers. Remove this once the network allows normal DNS results.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      # Без этого тома скачанные фото живут только в слое контейнера и
      # исчезают при docker compose down/up.
      - ./media:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
